[project]
name = "agri-assistant"
version = "0.1.0"
description = "Agri Assistant Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.2",
    "langchain>=1.3.6",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-groq",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pypdf>=6.13.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "psycopg2-binary",
    "pgvector",
    "langchain-text-splitters",
    "redis",
    "fastapi",
    "uvicorn[standard]",
    "httpx"
]

[dependency-groups]
dev = [
    "pytest"
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit the live Postgres/pgvector store",
]

[tool.vercel]
entrypoint = "src.api.main:app"